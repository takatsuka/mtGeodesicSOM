name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    # Advisory for now: some of the code predates these lint rules.
    # Remove this line once `ruff check .` is clean.
    ##continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.16,<0.17"
      - run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      # Until mtgeodesicdome is on PyPI, install it from GitHub (needs takatsuka/mtGeodesicDome to be public).
      # Delete this step once `pip install mtgeodesicdome` works.
      # - run: pip install "mtgeodesicdome @ git+https://github.com/takatsuka/mtGeodesicDome.git" # it is now on pypi
      - run: pip install -e ".[dev]"
      - run: pytest --cov=mt.geodesicsom --cov-report=term-missing
